name: Deploy browser build to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "tests/web/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer run supersedes an older one. Letting both finish means whichever
# finishes LAST wins, which is not necessarily the newest commit: re-running an
# old run replays that old commit, and it can land after a newer push and quietly
# put the site back. Cancelling is safe here because the site is static, so there
# is no half-finished state to protect.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The site is static: no build step, nothing to install. Guard instead
      # against publishing a personal photo or bundled donor archive, or
      # shipping stale PWA metadata/offline asset paths.
      # The parentheses matter: without them -print binds to the last -iname only.
      - name: Check the site contains no photos
        run: |
          found=$(find web \( -iname '*.heic' -o -iname '*.heif' -o -iname '*.dng' \) -print)
          if [ -n "$found" ]; then
            echo "::error::web/ contains photo files; they must not be published"
            echo "$found"
            exit 1
          fi

      - name: Check generated profiles replace bundled donor assets
        run: |
          for f in web/src/generated-profile.js web/src/synthetic-hevc.js web/src/ffmpeg-hevc.js web/src/ffmpeg-worker.js web/src/ffmpeg-assets.js; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          test ! -e web/profiles || { echo "::error::obsolete web/profiles must not be published"; exit 1; }

      - name: Check web regressions, PWA metadata, and translations
        run: npm test

      # enablement turns Pages on if it is not already, so a fresh clone of this
      # repo deploys without anyone visiting the settings page first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
